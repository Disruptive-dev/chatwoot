name: OptimiA CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RAILS_ENV: test
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm i
      - name: Run ESLint
        run: pnpm run eslint

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm i
      - name: Run frontend tests
        run: pnpm run test:coverage
      - name: Upload frontend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-logs
          path: coverage/
          retention-days: 3

  backend-tests:
    name: Backend Tests (${{ matrix.ci_node_index }}/${{ matrix.ci_node_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pnpm dependencies
        run: pnpm i
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
      - name: Prepare database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load
      - name: Run backend tests (parallelized)
        run: |
          SPEC_FILES=($(find spec -name '*_spec.rb' | sort))
          TESTS=""
          for i in "${!SPEC_FILES[@]}"; do
            if [ $(( i % ${{ matrix.ci_node_total }} )) -eq ${{ matrix.ci_node_index }} ]; then
              TESTS="$TESTS ${SPEC_FILES[$i]}"
            fi
          done
          if [ -n "$TESTS" ]; then
            bundle exec rspec --profile=10 --format progress $TESTS
          fi
      - name: Upload rails log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rails-log-${{ matrix.ci_node_index }}
          path: log/
          retention-days: 3

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=optimia-ci-amd64
          cache-to: type=gha,mode=max,scope=optimia-ci-amd64
          build-args: |
            SECRET_KEY_BASE=dummy_secret_key_base_for_assets
            FRONTEND_URL=https://staging.optimia.spectra-metrics.com
            INSTALLATION_NAME=OptimiA
            BRAND_NAME=OptimiA

  zeitwerk:
    name: Zeitwerk Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Check autoloading
        run: bundle exec rails zeitwerk:check

  optimia-channel-manager-tests:
    name: OptimiA Channel Manager Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
      - name: Prepare database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load
      - name: Run Channel Manager specs
        run: |
          bundle exec rspec \
            spec/services/optimia/channel_manager \
            spec/models/optimia_channel_connection_spec.rb \
            spec/models/optimia_channel_connection_audit_spec.rb \
            spec/requests/api/v1/accounts/optimia \
            spec/jobs/optimia/channel_manager \
            spec/lib/integrations/optimia/channel_manager \
            spec/requests/optimia/outbound_webhook_delivery_spec.rb

  optimia-technical-health-tests:
    name: OptimiA Technical Health Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
      - name: Prepare database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load
      - name: Run Technical Health specs
        run: |
          bundle exec rspec \
            spec/services/optimia/technical_health \
            spec/controllers/super_admin/technical_health_controller_spec.rb

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-tests
      - frontend-lint
      - frontend-tests
      - docker-build-test
      - zeitwerk
      - optimia-channel-manager-tests
      - optimia-technical-health-tests
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## OptimiA CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Backend Lint | ${{ needs.backend-lint.result }} |"
            echo "| Backend Tests | ${{ needs.backend-tests.result }} |"
            echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |"
            echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |"
            echo "| Docker Build Test | ${{ needs.docker-build-test.result }} |"
            echo "| Zeitwerk | ${{ needs.zeitwerk.result }} |"
            echo "| Channel Manager Tests | ${{ needs.optimia-channel-manager-tests.result }} |"
            echo "| Technical Health Tests | ${{ needs.optimia-technical-health-tests.result }} |"
            echo ""
            echo "**No images published.** This workflow does not deploy or push container images."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
