# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails.
# Optimized by Disruptive SW for OptimIA project.

en:
  hello: 'Hello world'
  # --- INYECCIÓN DE MARCA OPTIMIA ---
  login:
    title: "Login to %{installationName}"
    welcome: "Welcome to OptimIA"
  # ----------------------------------
  inbox:
    reauthorization:
      success: 'Channel reauthorized successfully'
      not_required: 'Reauthorization is not required for this inbox'
      invalid_channel: 'Invalid channel type for reauthorization'
  auth:
    saml:
      invalid_email: 'Please enter a valid email address'
      authentication_failed: 'Authentication failed. Please check your credentials and try again.'
  messages:
    reset_password_success: "OptimIA! Request for password reset is successful. Check your mail for instructions."
    reset_password_failure: "Uh ho! We could not find any user with the specified email."
    reset_password_saml_user: "This account uses SAML authentication. Password reset is not available."
    login_saml_user: "This account uses SAML authentication. Please sign in through your organization's SAML provider."
    saml_not_available: "SAML authentication is not available in this installation."
    inbox_deletetion_response: "Your inbox deletion request will be processed in some time."

  errors:
    validations:
      presence: must not be blank
    webhook:
      invalid: Invalid events
    signup:
      disposable_email: "We do not allow disposable emails"
      blocked_domain: "This domain is not allowed. If you believe this is a mistake, please contact support."
      invalid_email: "You have entered an invalid email"
      email_already_exists: 'You have already signed up for an account with %{email}'
      invalid_params: 'Invalid, please check the signup parameters and try again'
      failed: Signup failed
    # ... (resto de validaciones mantenidas por integridad técnica)

  integration_apps:
    dashboard_apps:
      name: 'Dashboard Apps'
      description: 'Dashboard Apps allow you to create and embed applications that display user information, providing more context to your OptimIA agents.'
    dyte:
      name: 'Dyte'
      short_description: 'Start video/voice calls with customers directly from OptimIA.'
      description: 'Dyte is a product that integrates audio and video functionalities. With this integration, your agents can start video/voice calls with your customers directly from OptimIA.'
    slack:
      name: 'Slack'
      short_description: 'Receive notifications and respond to conversations directly in Slack.'
      description: "Integrate OptimIA with Slack to keep your team in sync. This integration allows you to receive notifications for new conversations and respond to them directly within Slack's interface."
    webhooks:
      name: 'Webhooks'
      description: 'Webhook events provide real-time updates about activities in your OptimIA account. You can subscribe to your preferred events, and OptimIA will send you HTTP callbacks with the updates.'
    dialogflow:
      name: 'Dialogflow'
      short_description: 'Build chatbots to handle initial queries before transferring to agents.'
      description: 'Build chatbots with Dialogflow and easily integrate them into your inbox. These bots can handle initial queries before transferring them to an OptimIA agent.'
    openai:
      name: 'OpenAI'
      short_description: 'AI-powered reply suggestions, summarization, and message enhancement.'
      description: 'Leverage the power of large language models from OpenAI within OptimIA for features such as reply suggestions, summarization, and message rephrasing.'
    
  crm:
    no_message: 'No messages in conversation'
    attachment: '[Attachment: %{type}]'
    no_content: '[No content]'
    created_activity: |
      New conversation started on %{brand_name}

      Channel: %{channel_info}
      Created: %{formatted_creation_time}
      Conversation ID: %{display_id}
      View in %{brand_name}: %{url}
    transcript_activity: |
      Conversation Transcript from %{brand_name}

      Channel: %{channel_info}
      Conversation ID: %{display_id}
      View in %{brand_name}: %{url}

      Transcript:
      %{format_messages}
